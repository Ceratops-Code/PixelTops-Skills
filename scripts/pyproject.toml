[project]
name = "pixeltops-repository-tools"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mypy==2.3.1",
  "numpy==2.5.3",
  "opencv-python-headless==5.0.0.93",
  "pillow==12.3.0",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
files = ["."]
exclude = ["(^|/)\\.venv/"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
